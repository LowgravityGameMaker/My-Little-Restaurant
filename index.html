<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>도트 사계절 식당</title>
  <link rel="stylesheet" href="style.css?v=5" />
</head>
<body>
  <div id="game-wrapper">
    <header id="top-bar">
      <div class="hud-box" id="money-display">
        <canvas id="icon-coin" width="16" height="16" class="pixel-icon"></canvas>
        <span id="money-text">500 G</span>
      </div>
      <div class="hud-box" id="time-display">
        <span id="season-day-text">봄 1일차</span>
        <span id="phase-timer-text">낮 10:00</span>
      </div>
      <div id="top-right-icons">
        <button class="icon-btn" id="btn-recipe-book" title="레시피북">
          <canvas id="icon-book" width="16" height="16" class="pixel-icon"></canvas>
        </button>
        <button class="icon-btn" id="btn-encyclopedia" title="도감">
          <canvas id="icon-dex" width="16" height="16" class="pixel-icon"></canvas>
        </button>
      </div>
    </header>

    <main id="viewport">
      <section id="scene-restaurant" class="scene active">
        <div id="kitchen-view" class="sub-view active">
          <div id="kitchen-top-controls">
            <button id="btn-open-ingredients" class="pixel-btn">재료 꺼내기</button>
            <button id="btn-ring-bell" class="pixel-btn accent">서빙 벨</button>
          </div>
          <div class="canvas-box">
            <canvas id="kitchen-canvas" width="540" height="720"></canvas>
          </div>
          <div id="kitchen-hint">재료를 선택해 조리도구에 넣으세요</div>
        </div>

        <div id="hall-view" class="sub-view">
          <div id="hall-top-controls">
            <button id="btn-back-kitchen" class="pixel-btn">조리대로 돌아가기</button>
          </div>
          <div class="canvas-box">
            <canvas id="hall-canvas" width="540" height="720"></canvas>
          </div>
          <div id="serving-tray"></div>
        </div>
      </section>

      <section id="scene-farm" class="scene">
        <div class="canvas-box">
          <canvas id="farm-canvas" width="540" height="720"></canvas>
        </div>
        <div id="farm-controls" class="bottom-overlay-bar">
          <span id="farm-status-text">밭, 닭장, 버섯 그늘을 터치하세요</span>
        </div>
      </section>

      <section id="scene-fishing" class="scene">
        <div class="canvas-box">
          <canvas id="fishing-canvas" width="540" height="720"></canvas>
        </div>
        <div id="fishing-controls" class="bottom-overlay-bar">
          <button id="btn-cast-rod" class="pixel-btn">낚싯대 던지기</button>
          <button id="btn-set-trap" class="pixel-btn">통발 설치/확인</button>
        </div>
      </section>

      <section id="scene-market" class="scene">
        <canvas id="market-canvas" width="540" height="210"></canvas>
        <div id="market-stalls" class="scroll-grid"></div>
      </section>
    </main>

    <nav id="bottom-nav">
      <button class="nav-btn active" data-target="restaurant">식당</button>
      <button class="nav-btn" data-target="farm">뒷밭</button>
      <button class="nav-btn" data-target="fishing">낚시터</button>
      <button class="nav-btn" data-target="market">시장</button>
    </nav>

    <div id="modal-overlay" class="hidden">
      <div id="modal-box">
        <div id="modal-header">
          <span id="modal-title">창 제목</span>
          <button id="btn-close-modal" class="pixel-btn small">X</button>
        </div>
        <div id="modal-content"></div>
      </div>
    </div>
  </div>

  <script src="data.js?v=5"></script>
  <script src="sprites.js?v=5"></script>
  <script src="state.js?v=5"></script>
  <script src="main.js?v=5"></script>
</body>
</html>
